name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # Fails when uv.lock no longer matches pyproject.toml
      - name: Install dependencies
        run: uv sync --locked
      - name: Import the package
        run: uv run python -c "import pypx800"
      - name: Build the package
        run: uv build

  # Dependabot updates are merged once the checks passed, except semver-major
  # ones. RELEASE_TOKEN (an Actions and a Dependabot secret) is needed to merge
  # changes to workflow files and to trigger the release workflow.
  dependabot:
    name: Dependabot merge
    needs: [build]
    # Opened by Dependabot from a branch of the repository. The called workflow
    # also checks the last push came from Dependabot, with its commits.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    uses: Aohzan/.github/.github/workflows/dependabot-merge.yaml@ae7bef8d171afeda0951efefff7f1f1737a5cb39 # v3
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
